<style>
:root{--bg:#f6f7fb;--sf:#fff;--tx:#0e1530;--mu:#5b6482;--ac:#2b4cff;--ac2:#ffb020;--bd:#e1e5f0;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0a0f24;--sf:#121936;--tx:#eef1ff;--mu:#9aa5cf;--ac:#7b93ff;--ac2:#ffc24d;--bd:#243061;--on:#0a0f24}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f24;--sf:#121936;--tx:#eef1ff;--mu:#9aa5cf;--ac:#7b93ff;--ac2:#ffc24d;--bd:#243061;--on:#0a0f24}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--tx);font-family:'Cairo','Sora',sans-serif;line-height:1.7}
html[lang=en] body{font-family:'Sora','Cairo',sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.wrap{max-width:1080px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.bar{display:flex;align-items:center;gap:10px;height:62px}
.logo{font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:8px;margin-inline-end:auto}
.lg{width:42px;height:42px;background:#fff;border-radius:12px;padding:4px;border:1px solid var(--bd);object-fit:contain}
nav{display:flex;gap:18px;font-size:.92rem;color:var(--mu)}
.ib{border:1px solid var(--bd);background:var(--sf);border-radius:10px;min-width:40px;height:40px;padding:0 10px;font-weight:600;position:relative}
.ib b{position:absolute;top:-6px;inset-inline-end:-6px;background:var(--ac2);color:#111;border-radius:99px;font-size:.7rem;min-width:19px;height:19px;display:grid;place-items:center}
@media(max-width:720px){nav{display:none}}
@media(max-width:400px){.logo span{font-size:.95rem}.bar{gap:6px}.ib{min-width:36px;padding:0 6px}.wrap{padding:0 14px}.logo{gap:6px;min-width:0}.logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
.hero{padding:64px 0 48px;display:grid;gap:36px;grid-template-columns:1.15fr .85fr;align-items:center}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:40px}}
h1{font-size:clamp(2.1rem,6vw,3.7rem);line-height:1.2;font-weight:800}
.lead{color:var(--mu);font-size:1.08rem;margin:16px 0 26px;max-width:46ch}
.btn{display:inline-block;border:0;border-radius:12px;padding:12px 22px;font-weight:700;background:var(--ac);color:var(--on)}
.btn.o{background:transparent;border:1.5px solid var(--bd);color:var(--tx)}
.btn.w{background:#1faa59;color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stage{background:var(--sf);border:1px solid var(--bd);border-radius:24px;padding:22px;display:grid;gap:12px}
.chip{display:flex;align-items:center;gap:12px;border:1px solid var(--bd);border-radius:14px;padding:12px 14px;font-weight:600}
.chip:nth-child(2){margin-inline-start:28px}.chip:nth-child(3){margin-inline-start:8px}
.chip s{text-decoration:none;font-size:1.5rem}
section{padding:46px 0}
h2{font-size:1.8rem;font-weight:800;margin-bottom:6px}
.sub{color:var(--mu);margin-bottom:26px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px}
.card .ic{font-size:1.9rem}
.card h3{font-size:1.08rem}
.card p{color:var(--mu);font-size:.92rem;flex:1}
.price{font-weight:800;font-size:1.15rem;color:var(--ac)}
.card .row .btn{padding:9px 14px;font-size:.88rem;flex:1;text-align:center}
.steps{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));counter-reset:s}
.step{border-inline-start:3px solid var(--ac2);padding:4px 14px;counter-increment:s}
.step:before{content:counter(s);font-weight:800;color:var(--ac2);font-size:1.4rem}
.step p{color:var(--mu);font-size:.92rem}
footer{border-top:1px solid var(--bd);padding:28px 0;color:var(--mu);font-size:.9rem;text-align:center}
.ov{position:fixed;inset:0;background:rgba(5,8,22,.55);z-index:40;display:none}
.ov.on{display:block}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);background:var(--bg);z-index:50;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));display:none;flex-direction:column;gap:12px;overflow:auto}
.drawer.on{display:flex}
.modal{position:fixed;z-index:60;inset:auto 0 0 0;max-width:480px;margin:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));display:none;gap:10px;flex-direction:column;border:1px solid var(--bd)}
.modal.on{display:flex}
@media(min-width:600px){.modal{inset:0;height:fit-content;border-radius:22px}}
.item{display:flex;gap:10px;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:10px 12px}
.item span:nth-child(2){flex:1;font-weight:600;font-size:.95rem}
.q{display:flex;align-items:center;gap:6px}
.q button{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--bg)}
label{font-size:.88rem;font-weight:600;display:grid;gap:4px}
input{font:inherit;border:1.5px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:12px;padding:11px 12px;width:100%}
input.bad{border-color:#e5484d}
.ph{display:flex;gap:8px}.ph input{flex:1;min-width:0}
.cc{position:relative;width:44%;flex:none}
.ccb{width:100%;font:inherit;border:1.5px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:12px;padding:11px 8px;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccp{display:none;position:absolute;bottom:calc(100% + 6px);inset-inline-start:0;width:min(300px,86vw);background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:8px;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.ccp.on{display:block;animation:pop .2s}
#ccL{max-height:210px;overflow:auto;margin-top:6px}
#ccL button{display:block;width:100%;border:0;background:none;padding:9px 8px;border-radius:8px;text-align:start}
#ccL button:hover{background:var(--bg)}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem;padding:8px 2px}
.empty{color:var(--mu);text-align:center;padding:30px 0}
.x{align-self:flex-end;border:0;background:none;font-size:1.4rem}
.toast{position:fixed;bottom:24px;inset-inline:0;margin:auto;width:fit-content;background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.stats{gap:0;padding:6px 22px}
.stat{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--bd)}.stat:last-child{border:0}
.stat>b{min-width:96px;font-size:2rem;font-weight:800;color:var(--ac);line-height:1.1}
.stat>b small{display:block;font-size:.8rem;color:var(--ac2);letter-spacing:2px}
.stat strong{display:block}.stat div span{color:var(--mu);font-size:.88rem}
.btn,.ib,.card,.q button{transition:transform .18s,box-shadow .2s,background .2s}
.btn:hover,.card:hover{transform:translateY(-3px)}
.btn:active,.ib:active,.q button:active{transform:scale(.93)}
.btn{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}
html[dir=rtl] .drawer{--sx:-100%}
.drawer.on{animation:slide .32s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(var(--sx,100%))}}
.modal.on{animation:pop .28s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.97)}}
.ov.on{animation:fade .25s}@keyframes fade{from{opacity:0}}
.bump{animation:bump .35s}@keyframes bump{50%{transform:scale(1.5)}}
.rv{opacity:0;transform:translateY(24px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

  const sel = $("fCode"), cur = sel.value || "EG";
  const mk = l => { try { return new Intl.DisplayNames([l], {type:"region"}); } catch(e){ return null; } };
  const dn = mk(lang), de = mk("en"), da = mk("ar");
  const nm = (o,c) => { try { return o ? o.of(c) : c; } catch(e){ return c; } };
  sel.innerHTML = CC.split(",").map(x => { const [c,d] = x.split(":"); return `<option value="${c}" data-d="${d}" data-s="${(nm(de,c)+" "+nm(da,c)+" "+d).toLowerCase()}">${flag(c)} +${d} ${nm(dn,c)}</option>`; }).join("");
  sel.value = cur;
  $("ccQ").placeholder = lang==="ar" ? "ابحث باسم الدولة..." : "Search country...";
  ccFilter(""); ccBtn();
}
function ccBtn(){ $("ccBtn").textContent = $("fCode").selectedOptions[0].textContent; }
function ccFilter(q){ q = q.trim().toLowerCase().replace(/^\+/,""); $("ccL").innerHTML = [...$("fCode").options].filter(o => !q || o.dataset.s.includes(q)).map(o => `<button type="button" data-cc="${o.value}">${o.textContent}</button>`).join("") || `<div class="empty">—</div>`; }
function render(){
  root.lang = lang; root.dir = lang==="ar" ? "rtl" : "ltr";
  $("lang").textContent = lang==="ar" ? "EN" : "ع";
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = T[lang][e.dataset.i]);
  document.title = "MM Developments";
  $("yr").textContent = new Date().getFullYear();
  fillCodes();
  $("grid").innerHTML = S.map(s => `<div class="card"><div class="ic">${s.ic}</div><h3>${s[lang][0]}</h3><p>${s[lang][1]}</p><div class="price">${fmt(s.p)}</div><div class="row"><button class="btn o" data-add="${s.id}">${T[lang].add}</button><button class="btn" data-buy="${s.id}">${T[lang].buy}</button></div></div>`).join("");
  const msg = lang==="ar" ? "أهلاً MM Developments، حابب أستفسر عن خدماتكم." : "Hi MM Developments, I’d like to ask about your services.";
  $("waDirect").href = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
  renderCart();
}
function renderCart(){
  sv("mm_cart", JSON.stringify(cart));
  $("cnt").textContent = cart.reduce((a,c)=>a+c.q,0);
  $("items").innerHTML = cart.length ? cart.map(c => { const s = S.find(x=>x.id===c.id); return `<div class="item"><span>${s.ic}</span><span>${s[lang][0]}<br><small style="color:var(--mu)">${fmt(s.p)}</small></span><span class="q"><button data-dec="${c.id}">−</button><b>${c.q}</b><button data-inc="${c.id}">+</button></span></div>`; }).join("") : `<div class="empty">${T[lang].empty}</div>`;
  $("total").textContent = $("total2").textContent = fmt(total());
  $("checkout").disabled = !cart.length; $("checkout").style.opacity = cart.length ? 1 : .5;
}
function add(id){ const c = cart.find(x=>x.id===id); c ? c.q++ : cart.push({id,q:1}); renderCart(); const n = $("cnt"); n.classList.remove("bump"); void n.offsetWidth; n.classList.add("bump"); }
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),3400); }
function open(el){ $("ov").classList.add("on"); el.classList.add("on"); }
function closeAll(){ ["ov","drawer","modal"].forEach(i=>$(i).classList.remove("on")); $("waGo").style.display="none"; $("ccP").classList.remove("on"); $("confirm").style.display=""; }

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.add){ add(t.dataset.add); toast(T[lang].added); }
  if(t.dataset.buy){ if(!cart.find(x=>x.id===t.dataset.buy)) add(t.dataset.buy); closeAll(); open($("modal")); }
  if(t.dataset.inc) add(t.dataset.inc);
  if(t.dataset.dec){ const c = cart.find(x=>x.id===t.dataset.dec); c.q--; if(c.q<=0) cart = cart.filter(x=>x!==c); renderCart(); }
});
$("cartBtn").onclick = () => open($("drawer"));
$("closeCart").onclick = $("closeM").onclick = $("ov").onclick = closeAll;
$("checkout").onclick = () => { if(!cart.length) return; closeAll(); open($("modal")); };
$("checkout2").onclick = () => { closeAll(); open($("drawer")); };
$("ccBtn").onclick = () => { const p = $("ccP"); p.classList.toggle("on"); if(p.classList.contains("on")){ $("ccQ").value = ""; ccFilter(""); $("ccQ").focus(); } };
$("ccQ").oninput = e => ccFilter(e.target.value);
$("ccL").onclick = e => { const b = e.target.closest("[data-cc]"); if(!b) return; $("fCode").value = b.dataset.cc; ccBtn(); $("ccP").classList.remove("on"); };
$("lang").onclick = () => { lang = lang==="ar" ? "en" : "ar"; sv("mm_lang", lang); render(); };
$("theme").onclick = () => { const n = root.dataset.theme==="dark" ? "light" : "dark"; root.dataset.theme = n; sv("mm_theme", n); };
document.addEventListener("keydown", e => { if(e.key==="Escape") closeAll(); });

// فلتر الألفاظ غير اللائقة
const norm = t => t.toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/(.)\1+/g,"$1");
const leet = t => t.replace(/[@4]/g,"a").replace(/0/g,"o").replace(/[1!|]/g,"i").replace(/3/g,"e").replace(/[$5]/g,"s");
const BAD = ("كس,كسم,كسمك,كسامك,كسختك,كسك,طيز,زب,زبي,عير,شرموط,شرموطه,متناك,متناكه,منيوك,منيك,نيك,خول,عرص,معرص,قحبه,لبوه,كلب,ابن الكلب,ابن المتناكه,ابن الوسخه,زانيه,عاهره,خرا,زفت,حيوان,غبي,حمار,ياكلب,يلعن,ملعون,fuck,motherfucker,shit,bitch,asshole,dick,pussy,cunt,bastard,slut,whore,nigger,nigga,faggot,retard,porn,idiot,stupid").split(",").map(norm);
function isBad(txt){
  return [txt, leet(txt)].some(v => {
    const n = norm(v), toks = n.split(/[^a-z\u0621-\u064A]+/).filter(Boolean), glued = n.replace(/[^a-z\u0621-\u064A]/g,""), spaced = toks.some(t => t.length === 1);
    return BAD.some(w => {
      if(w.includes(" ") || spaced) return glued.includes(w.replace(/ /g,""));
      return toks.some(t => t === w || (/^[a-z]+$/.test(w) && w !== "dick" && t.startsWith(w)) || (w.length >= 5 && t.includes(w)));
    });
  });
}
$("confirm").onclick = () => {
  const f = {n:$("fName"), p:$("fPhone"), b:$("fBrand")};
  let ok = true;
  Object.values(f).forEach(i => { const bad = !i.value.trim(); i.classList.toggle("bad", bad); if(bad) ok = false; });
  const junk = [f.n, f.b].filter(i => i.value.trim() && (isBad(i.value) || /(.)\1{4,}/.test(i.value) || (i.value.match(/[a-z\u0621-\u064A]/gi) || []).length < 2));
  junk.forEach(i => i.classList.add("bad"));
  if(junk.length){ toast(T[lang].bad); return; }
  const dial = $("fCode").selectedOptions[0].dataset.d, raw = f.p.value.replace(/\D/g,"");
  let nat = raw.replace(/^0+/,""); if(dial==="20" && raw.startsWith("20") && raw.length >= 12) nat = raw.slice(2);
  const phoneFull = "+" + dial + nat;
  const badPhone = dial==="20" ? raw.length < 11 : (dial + nat).length < 11;
  $("pErr").style.display = badPhone ? "block" : "none";
  if(badPhone){ f.p.classList.add("bad"); ok = false; }
  if(!ok || !cart.length){ toast(badPhone ? T[lang].perr : T[lang].err); return; }
  const ar = lang==="ar";
  const fm = n => n.toLocaleString("en-US") + " " + CUR[lang];
  const lines = cart.map(c => { const s = S.find(x=>x.id===c.id); return `- *${s[lang][0]}* (x${c.q}): ${fm(s.p*c.q)}`; }).join("\n");
  const line = "==============================";
  const text = ar
    ? `*طلب جديد من موقع MM Developments*\n${line}\n\n*الاسم:* ${f.n.value.trim()}\n*الموبايل:* ${phoneFull}\n*البيزنس / البراند:* ${f.b.value.trim()}\n\n*الخدمات المطلوبة:*\n${lines}\n\n*الإجمالي:* ${fm(total())}\n${line}\nبانتظار تأكيدكم وتحديد موعد البدء.`
    : `*New order from MM Developments*\n${line}\n\n*Name:* ${f.n.value.trim()}\n*Phone:* ${phoneFull}\n*Business / Brand:* ${f.b.value.trim()}\n\n*Requested services:*\n${lines}\n\n*Total:* ${fm(total())}\n${line}\nWaiting for your confirmation and start date.`;
  const go = $("waGo"); go.href = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(text)}`;
  go.click();
  cart = []; renderCart(); closeAll();
  Object.values(f).forEach(i => i.value = "");
};
document.addEventListener("pointerdown", e => { const b = e.target.closest(".btn"); if(!b) return; const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height), sp = document.createElement("span"); sp.className = "rip"; sp.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`; b.appendChild(sp); setTimeout(() => sp.remove(), 600); });
if("IntersectionObserver" in window){ const io = new IntersectionObserver(es => es.forEach(x => { if(x.isIntersecting){ x.target.classList.add("in"); io.unobserve(x.target); } }), {threshold:.1}); document.querySelectorAll("section").forEach(sc => { sc.classList.add("rv"); io.observe(sc); }); }
render();
</script>
</body>
